name: screenshots
on:
  push:
    branches: [shots]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon -q
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run emulator and capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash .github/scripts/shots.sh
      - name: Publish screenshots branch
        run: |
          cd shots
          git init -q
          git config user.name screenshots
          git config user.email screenshots@users.noreply.github.com
          git add .
          git commit -qm "screenshots from run ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:refs/heads/screenshots
